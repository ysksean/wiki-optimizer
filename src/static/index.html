<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wiki-optimizer</title>
<script>
  // 테마 부트스트랩 — 첫 페인트 전에 동기 실행해 wrong-theme flash를 막는다.
  (function () {
    var t = null;
    try { t = localStorage.getItem("wikiopt_theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="주 메뉴">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6.5h9a4 4 0 0 1 4 4v7H9a4 4 0 0 1-4-4v-7Z" fill="none" stroke="currentColor"/><path d="M9 10h5M9 13h6" fill="none" stroke="currentColor"/></svg></span>wiki-optimizer</h1>
    <div class="nav-label">Workspace</div>
    <button type="button" class="navitem" id="nav-opt" aria-current="page" onclick="showView('opt')">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM9 5v14M9 10h10"/></svg></span><span data-i18n="nav_opt"></span></button>
    <button type="button" class="navitem" id="nav-propose" onclick="showView('propose')">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3Z"/></svg></span><span data-i18n="nav_propose"></span></button>
    <button type="button" class="navitem" id="nav-runs" onclick="showView('runs')">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></span><span data-i18n="nav_runs"></span>
      <span class="navcount" id="runsCountNav"></span></button>
    <div class="side-foot">
      <div class="workspace-card"><small data-i18n="current_wiki"></small><b id="currentWorkspaceName">—</b><span id="currentWorkspaceMeta" data-i18n="workspace_empty"></span></div>
      <div class="language-row"><label for="theme" data-i18n="theme"></label><select id="theme" onchange="setTheme(this.value)"><option value="system" data-i18n="theme_system"></option><option value="light" data-i18n="theme_light"></option><option value="dark" data-i18n="theme_dark"></option></select></div>
      <div class="language-row"><label for="lang" data-i18n="language" data-i18n-title="language_tip"></label><select id="lang" onchange="setLang(this.value)"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></div>
    </div>
  </nav>

  <main>
  <header class="app-topbar"><div class="breadcrumb"><b id="topWorkspace">wiki-optimizer</b><span>/</span><span id="topCurrent" data-i18n="nav_opt"></span></div><label class="sr-only" for="mobileLang" data-i18n="language"></label><select class="mobile-language" id="mobileLang" onchange="setLang(this.value)"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></header>

  <section id="view-opt" class="view view-shell">
  <div class="page-intro"><div><h2 data-i18n="opt_title"></h2><p data-i18n="opt_desc"></p><div class="live-status" id="liveStatus" aria-live="polite"></div></div><div class="path-chip" id="pathChip"><code id="currentPath" data-i18n="path_not_set"></code><button type="button" onclick="focusFolder()" data-i18n="change_folder"></button></div></div>
  <div class="workbench-grid">
  <div class="setup-rail">
    <div class="rail-head"><h2 data-i18n="rail_title"></h2><p data-i18n="rail_desc"></p></div>
    <section class="workspace-panel" aria-labelledby="setup-title"><div class="workspace-head"><div><h2 id="setup-title" data-i18n="docs_title"></h2><p data-i18n="docs_hint"></p></div><span class="doc-count" id="docCount">0 / 0</span></div>
      <label class="sr-only" for="dir" data-i18n="folder_label"></label>
      <div class="folder-tools"><input type="text" id="dir" data-i18n-placeholder="folder_ph" oninput="handleDirInput()" onchange="savePrefs()"><button type="button" class="ghost" onclick="pickDir()" data-i18n="pick_dir"></button><button type="button" class="ghost" id="loadDocsBtn" onclick="loadDocs()" data-i18n="load_docs"></button></div>
      <div class="docs-tools"><label class="doc-search" for="docSearch"><span class="sr-only" data-i18n="doc_search"></span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input type="text" id="docSearch" data-i18n-placeholder="doc_search" oninput="filterDocs()"></label><div class="doc-filter"><button type="button" id="filterAll" class="on" aria-pressed="true" onclick="setDocFilter(false)" data-i18n="filter_all"></button><button type="button" id="filterSelected" aria-pressed="false" onclick="setDocFilter(true)" data-i18n="filter_selected"></button></div></div>
      <div id="docs" class="docs"><div class="docs-empty" data-i18n="docs_empty"></div></div>
      <div id="docsToolbar" class="docs-toolbar" hidden><span id="docsStatus" role="status" aria-live="polite"></span><button type="button" id="toggleDocs" onclick="toggleAllDocs()"></button></div>
      <span id="msg" class="err view-message" role="status" aria-live="polite"></span>
    </section>
    <aside>
      <section class="experiment-panel" id="experiment-panel" aria-labelledby="experiment-title"><h2 id="experiment-title" data-i18n="experiment_title"></h2><p data-i18n="experiment_friendly_desc"></p>
        <label class="sr-only" for="mode" data-i18n="mode"></label><select id="mode" hidden><option value="summary" data-i18n="mode_a"></option><option value="structure" data-i18n="mode_b"></option></select>
        <div class="mode-cards" role="group" data-i18n-aria-label="mode"><button type="button" class="mode-card" id="modeSummary" aria-pressed="true" onclick="selectMode('summary')"><b data-i18n="mode_summary_title"></b><span data-i18n="mode_summary_desc"></span></button><button type="button" class="mode-card" id="modeStructure" aria-pressed="false" onclick="selectMode('structure')"><b data-i18n="mode_structure_title"></b><span data-i18n="mode_structure_desc"></span></button></div>
        <div class="experiment-summary"><div class="summary-row"><span data-i18n="gens"></span><strong id="gensSummary">3</strong></div><div class="summary-row"><span data-i18n="nqa"></span><strong id="nqaSummary">6</strong></div><div class="summary-row"><span data-i18n="backend"></span><strong id="backendSummary">Claude</strong></div>
          <details class="advanced-settings"><summary data-i18n="advanced_settings"></summary><div class="advanced-grid"><div><label for="gens" data-i18n="gens"></label><input type="number" id="gens" value="3" min="1" max="10" aria-describedby="gensHelp" oninput="syncExperimentSummary()" onchange="savePrefs()"><span class="field-help" id="gensHelp" data-i18n="gens_help"></span></div><div><label for="nqa" data-i18n="nqa"></label><input type="number" id="nqa" value="6" min="2" max="12" aria-describedby="nqaHelp" oninput="syncExperimentSummary()" onchange="savePrefs()"><span class="field-help" id="nqaHelp" data-i18n="nqa_help"></span></div><div class="backend-field"><label for="backend" data-i18n="backend"></label><select id="backend" onchange="syncExperimentSummary();savePrefs()"><option value="claude" data-i18n="backend_claude"></option><option value="codex" data-i18n="backend_codex"></option></select></div></div></details>
        </div><button type="button" class="run-primary" id="go" onclick="startRun()" data-i18n="run_exp" disabled></button><div class="safe-note"><svg viewBox="0 0 16 16"><path d="M8 1.5 13 3v4c0 3-2 5.5-5 7-3-1.5-5-4-5-7V3l5-1.5Z"/><path d="m5.5 7.5 1.7 1.7 3.5-3.5"/></svg><span data-i18n="safe_note"></span></div>
      </section>
      <section class="next-panel" aria-labelledby="wiki-title"><h2 id="wiki-title" data-i18n="wiki_title"></h2><p data-i18n="next_actions_desc"></p><div class="next-actions"><button type="button" id="auditBtn" class="ghost" onclick="startAudit()" data-i18n="btn_audit" disabled></button><button type="button" id="applyBtn" onclick="startApply()" data-i18n="btn_apply" disabled></button></div><span id="msg2" class="err view-message" role="status" aria-live="polite"></span><details><summary data-i18n="strategy_custom"></summary><label class="sr-only" for="strategy" data-i18n="strategy_label"></label><textarea id="strategy" rows="3"></textarea></details></section>
    </aside>
  </div>
    <section class="timeline-panel" id="timeline-panel" aria-labelledby="timeline-title">
      <div class="timeline-head"><h2 id="timeline-title" data-i18n="timeline_title"></h2><p data-i18n="timeline_desc"></p><button type="button" class="ghost timeline-all" onclick="showView('runs')" data-i18n="nav_runs"></button></div>
      <div id="optTimeline"><div class="card empty-state timeline-empty"><strong data-i18n="no_jobs"></strong><span data-i18n="no_jobs_hint"></span></div></div>
    </section>
  </div>
  </section>

  <section id="view-propose" class="view view-shell" hidden>
  <div class="page-intro"><div><h2 data-i18n="prop_friendly_title"></h2><p data-i18n="prop_friendly_desc"></p></div></div>
  <div class="propose-panel">
    <h2 class="panel-title" data-i18n="prop_title"></h2>
    <p class="panel-desc" data-i18n="prop_desc"></p>
    <label data-i18n="prop_sources" for="srcManual"></label>
    <div id="srcList" class="srclist"></div>
    <div class="srcbtns">
      <button type="button" class="ghost" onclick="pickSrcDir()" data-i18n="src_add_dir"></button>
      <button type="button" class="ghost" onclick="$('srcFile').click()" data-i18n="src_add_files"></button>
      <input type="file" id="srcFile" multiple accept=".md,.txt" hidden
        onchange="uploadSrcFiles(this.files)">
      <label class="sr-only" for="srcFile" data-i18n="src_add_files"></label>
      <input type="text" id="srcManual" data-i18n-placeholder="src_manual_ph"
        onkeydown="if(event.key==='Enter'){addSrcPath(this.value); this.value='';}">
    </div>
    <label for="propTask" style="margin-top:12px" data-i18n="prop_task"></label>
    <textarea id="propTask" rows="5" data-i18n-placeholder="prop_task_ph"
      onchange="savePrefs()" style="width:100%"></textarea>
    <div class="propose-actions">
      <button onclick="startPropose()" data-i18n="btn_propose"></button>
      <label for="propSeed" style="display:flex;align-items:center;gap:4px;margin:0">
        <input type="checkbox" id="propSeed"> <span data-i18n="prop_seed" data-i18n-title="prop_seed_tip"></span>
      </label>
      <span id="msg3" class="err" role="status" aria-live="polite"></span>
    </div>
  </div>
  <section class="timeline-panel propose-timeline" id="propose-timeline-panel" aria-labelledby="propose-timeline-title">
    <div class="timeline-head"><h2 id="propose-timeline-title" data-i18n="timeline_title"></h2><p data-i18n="timeline_desc"></p><button type="button" class="ghost timeline-all" onclick="showView('runs')" data-i18n="nav_runs"></button></div>
    <div id="proposeTimeline"><div class="card empty-state timeline-empty"><strong data-i18n="no_jobs"></strong><span data-i18n="no_jobs_hint"></span></div></div>
  </section>
  </section>

  <section id="view-runs" class="view view-shell" hidden>
  <div class="page-intro"><div><h2 data-i18n="runs_title"></h2><p data-i18n="runs_desc"></p></div></div>
  <div class="runs-filters">
    <div class="doc-filter" role="group" data-i18n-aria-label="filter_mode" id="runsModeFilter">
      <button type="button" class="on" data-mode="all" aria-pressed="true" onclick="setRunsFilter('mode','all',this)" data-i18n="filter_all"></button>
      <button type="button" data-mode="summary" aria-pressed="false" onclick="setRunsFilter('mode','summary',this)" data-i18n="mode_summary"></button>
      <button type="button" data-mode="structure" aria-pressed="false" onclick="setRunsFilter('mode','structure',this)" data-i18n="mode_structure"></button>
      <button type="button" data-mode="audit" aria-pressed="false" onclick="setRunsFilter('mode','audit',this)" data-i18n="mode_audit"></button>
      <button type="button" data-mode="apply" aria-pressed="false" onclick="setRunsFilter('mode','apply',this)" data-i18n="mode_apply"></button>
    </div>
    <label class="sr-only" for="runsStatus" data-i18n="filter_status"></label>
    <select id="runsStatus" onchange="setRunsFilter('status',this.value)"><option value="all" data-i18n="filter_all"></option><option value="active" data-i18n="filter_active"></option><option value="done" data-i18n="status_done"></option><option value="error" data-i18n="status_error"></option></select>
    <label class="doc-search runs-search" for="runsSearch"><span class="sr-only" data-i18n="runs_search"></span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="runsSearch" data-i18n-placeholder="runs_search" oninput="setRunsFilter('q',this.value)"></label>
  </div>
  <div class="section-head">
    <span class="count" id="runsCount"></span>
    <span class="work-status" id="workStatus" role="status" aria-live="polite"></span>
  </div>
  <div id="jobs"></div>
  </section>
  </main>
</div>
<nav class="mobile-nav" data-i18n-aria-label="mobile_menu"><button type="button" id="mobile-opt" class="on" aria-current="page" onclick="showView('opt')"><span class="ico" aria-hidden="true">▤</span><span data-i18n="nav_opt"></span></button><button type="button" id="mobile-propose" onclick="showView('propose')"><span class="ico" aria-hidden="true">✦</span><span data-i18n="nav_propose"></span></button><button type="button" id="mobile-runs" onclick="showView('runs')"><span class="ico" aria-hidden="true">≡</span><span data-i18n="nav_runs"></span></button></nav>

<script src="/static/app.js"></script>
</body>
</html>
