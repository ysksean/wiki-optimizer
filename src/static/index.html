<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wiki-optimizer</title>
<style>
  :root {
    color-scheme: dark;
    --font-sans: "Pretendard Variable", Pretendard, Inter, ui-sans-serif,
                 -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Apple SD Gothic Neo", sans-serif;
    --font-mono: "SFMono-Regular", ui-monospace, Consolas, "Liberation Mono", monospace;

    --bg: #090b10;
    --card: #11141b;
    --card-raised: #151922;
    --control: #0d1016;
    --hover: #191e28;

    --line: #252b36;
    --line-subtle: #1c222c;
    --line-strong: #343c4a;

    --tx: #f2f4f7;
    --tx-secondary: #c1c7d0;
    --dim: #98a1af;

    --acc: #7aa2f7;
    --acc-hover: #8db0ff;
    --acc-soft: rgba(122, 162, 247, 0.12);

    --ok: #62d49c;
    --ok-soft: rgba(98, 212, 156, 0.11);
    --warn: #e6b85c;
    --warn-soft: rgba(230, 184, 92, 0.11);
    --bad: #f07878;
    --bad-soft: rgba(240, 120, 120, 0.11);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-panel: 0 1px 1px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font: 400 16px/1.55 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(1180px, 100%); margin: 0 auto; padding: 28px 24px 96px; }
  @media (max-width: 640px) { .wrap { padding: 24px 16px 64px; } }

  /* ---------- 상단 크롬 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    min-height: 72px; margin-bottom: 32px; padding-bottom: 20px;
    border-bottom: 1px solid var(--line-subtle);
  }
  .topbar h1 {
    margin: 0 0 2px; font-size: 24px; line-height: 32px;
    font-weight: 650; letter-spacing: -0.025em;
  }
  .topbar .sub { margin: 0; max-width: 680px; color: var(--dim); font-size: 14px; line-height: 21px; }
  .topbar .spacer { flex: 1; }
  .language-control { flex: 0 0 112px; }

  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 32px 0 12px;
  }
  .section-head h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 650; }
  .section-head .count { color: var(--dim); font-size: 13px; }

  /* ---------- 패널 / 카드 ---------- */
  .card {
    margin-bottom: 16px; padding: 24px;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: var(--card); box-shadow: var(--shadow-panel);
  }
  .panel-title { font-size: 16px; font-weight: 650; margin: 0 0 6px; }
  .panel-desc { max-width: 820px; color: var(--dim); font-size: 14px; line-height: 21px; margin: 0 0 18px; }

  .workflow-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 22px; }
  .step-number {
    display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px;
    border: 1px solid rgba(122,162,247,.45); border-radius: 7px;
    background: var(--acc-soft); color: var(--acc); font-size: 13px; font-weight: 700;
  }
  .workflow-head .panel-title { margin-top: 1px; }
  .workflow-head .panel-desc { margin-bottom: 0; }
  .workflow-divider { height: 1px; margin: 24px 0; background: var(--line-subtle); }
  .field-help { display: block; margin-top: 6px; color: var(--dim); font-size: 12px; line-height: 16px; }

  label { display: block; margin-bottom: 7px; color: var(--tx-secondary); font-size: 13px; font-weight: 600; }
  .hint { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }

  input[type=text], input[type=number], select, textarea, button {
    min-height: 44px; border-radius: 8px; font: inherit;
  }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--line); background: var(--control);
    color: var(--tx); padding: 9px 12px; outline: none;
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft);
  }

  button {
    border: 1px solid transparent; background: var(--acc); color: #0a1020;
    padding: 9px 16px; font-weight: 650; cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s, transform .08s;
  }
  button:hover { background: var(--acc-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost {
    background: var(--card-raised); border-color: var(--line); color: var(--tx-secondary);
  }
  button.ghost:hover { background: var(--hover); border-color: var(--line-strong); color: var(--tx); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--acc-soft); }

  .folder-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; }
  .parameter-grid {
    display: grid; align-items: end; gap: 14px; margin-top: 0;
    grid-template-columns: minmax(220px,1.6fr) 132px 132px minmax(200px,1fr) auto;
  }
  .parameter-grid > .msg { align-self: center; }
  @media (max-width: 820px) {
    .folder-row, .parameter-grid { grid-template-columns: 1fr; }
    .parameter-grid { gap: 14px; }
  }

  /* ---------- 문서 선택 ---------- */
  .docs {
    display: grid; gap: 8px; margin-top: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  }
  .docs-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; margin-top: 12px; color: var(--dim); font-size: 13px;
  }
  .docs-toolbar[hidden] { display: none; }
  .docs-toolbar button { min-height: 44px; padding: 7px 12px; font-size: 13px; }
  .docs label {
    display: flex; align-items: center; gap: 10px; margin: 0;
    min-height: 44px; padding: 9px 12px; cursor: pointer;
    border: 1px solid var(--line-subtle); border-radius: 8px;
    background: var(--control); color: var(--tx-secondary);
    font-size: 14px; font-weight: 450;
    transition: background .12s, border-color .12s, color .12s;
  }
  .docs label:hover { border-color: var(--line-strong); background: var(--hover); }
  .docs label:has(input:checked) {
    border-color: rgba(122,162,247,.55); background: var(--acc-soft); color: var(--tx);
  }
  .docs input { accent-color: var(--acc); }
  .docs .sz { margin-left: auto; color: var(--dim); font-size: 12px;
              font-variant-numeric: tabular-nums; }

  /* ---------- 실행 기록 ---------- */
  #jobs .card { padding: 0; border-radius: var(--radius-md); box-shadow: none; overflow: hidden; }
  .job-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%; border: 0; border-radius: 0; background: transparent; color: inherit;
    text-align: left;
    min-height: 56px; padding: 14px 18px; cursor: pointer;
    transition: background .12s;
  }
  .job-head:hover { background: var(--hover); }
  .job-head:active { transform: none; }
  .job-head:focus-visible { position: relative; z-index: 1; box-shadow: inset 0 0 0 2px var(--acc); }
  .job-head .mode { font-weight: 650; font-size: 14px; }
  .job-head .docs-list {
    color: var(--tx-secondary); font-size: 13px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .job-head .meta {
    margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .chev { color: var(--dim); font-size: 11px; transition: transform .15s; }
  .chev.open { transform: rotate(180deg); }
  .job-body { padding: 4px 20px 20px; border-top: 1px solid var(--line-subtle); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .b-running { background: var(--acc-soft); color: var(--acc); }
  .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-error { background: var(--bad-soft); color: var(--bad); }
  .b-queued { background: var(--hover); color: var(--dim); }

  .runbox { margin-top: 16px; padding: 16px; border: 1px solid var(--line-subtle);
            border-radius: var(--radius-sm); background: var(--control); }
  .runbox h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .muted { color: var(--dim); font-weight: 400; font-size: 12px; }

  /* ---------- KPI ---------- */
  .kpis {
    display: grid; gap: 8px; margin: 16px 0 20px;
    grid-template-columns: repeat(auto-fit, minmax(132px, max-content));
  }
  .kpi {
    min-width: 132px; padding: 12px 14px;
    border: 1px solid var(--line-subtle); border-radius: 8px; background: var(--card);
  }
  .kpi b {
    display: block; font-size: 28px; line-height: 32px; font-weight: 650;
    letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
  }
  .kpi span { display: block; margin-top: 4px; color: var(--dim); font-size: 12px; line-height: 16px; }

  /* ---------- 테이블 ---------- */
  .table-wrap {
    width: 100%; overflow: auto; margin-top: 12px;
    border: 1px solid var(--line-subtle); border-radius: 8px; background: var(--card);
  }
  table { margin: 0; width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 0; font-size: 12px; }
  th, td { padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line-subtle);
           text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--control); color: var(--dim);
       font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  td { font-variant-numeric: tabular-nums; }
  tbody tr:hover td { background: var(--hover); }
  tr:last-child td { border-bottom: 0; }
  tr.is-best td { background: var(--ok-soft); }

  details { margin-top: 12px; }
  summary {
    display: flex; align-items: center; width: fit-content; min-height: 44px;
    cursor: pointer; color: var(--acc); font-size: 13px; font-weight: 550;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; margin-right: 7px; transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover { color: var(--acc-hover); }

  pre, .diff {
    white-space: pre-wrap; margin: 8px 0 0; padding: 16px;
    border: 1px solid var(--line-subtle); border-radius: 8px; background: var(--card);
    font: 12px/1.7 var(--font-mono); max-height: 340px; overflow: auto;
  }
  .diff del {
    padding: 1px 3px; border-radius: 3px; background: var(--bad-soft); color: #ffaaaa;
    text-decoration-color: rgba(255,170,170,.65); text-decoration-thickness: 1px;
  }
  .diff ins { padding: 1px 3px; border-radius: 3px; background: var(--ok-soft);
              color: #91e5b9; text-decoration: none; }

  .err { color: var(--bad); font-size: 13px; }
  .lenbar { display: inline-block; vertical-align: middle; width: 180px; height: 8px;
            overflow: hidden; border: 1px solid var(--line-subtle); border-radius: 99px;
            background: var(--card); }
  .lenbar i { display: block; height: 100%; background: var(--warn); }

  /* ---------- 차트 ---------- */
  .chart {
    margin-top: 8px; padding: 16px;
    border: 1px solid var(--line-subtle); border-radius: var(--radius-md); background: var(--card);
  }
  .chart-head { display: flex; gap: 14px; margin-bottom: 8px; font-size: 11px; color: var(--dim); }
  .chart-head i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--acc);
                  vertical-align: middle; margin-right: 5px; }
  .chart-head i.train { border-top: 2px dashed var(--line-strong); }
  .chart svg { display: block; width: 100%; height: auto; min-height: 150px; }
  svg text { fill: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }

  .arrow { color: var(--dim); margin: 0 6px; }
  .up { color: var(--ok); } .down { color: var(--bad); }
  .note { margin-top: 8px; color: var(--dim); font-size: 13px; }
  #jobs .empty-state { padding: 24px; color: var(--dim); }
  .empty-state strong { display: block; margin-bottom: 4px; color: var(--tx-secondary); font-size: 15px; }

  @media (max-width: 640px) {
    .topbar { align-items: flex-start; gap: 12px; }
    .topbar h1 { font-size: 22px; }
    .topbar .sub { font-size: 13px; }
    .language-control { flex-basis: 92px; }
    .language-control label { white-space: nowrap; }
    .card { padding: 24px; }
    .workflow-head { gap: 12px; }
    .workflow-divider { margin: 22px 0; }
    .action-row { display: grid !important; grid-template-columns: 1fr; }
    .action-row button { width: 100%; }
    .job-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; }
    .job-head .docs-list { grid-column: 1 / -1; }
    .job-head .meta { grid-column: 1 / -1; margin-left: 0; }
    .job-head .chev { grid-column: 3; grid-row: 1; }
    .job-body { padding: 4px 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>wiki-optimizer</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="spacer"></div>
    <div class="language-control"><label for="lang" data-i18n="language" data-i18n-title="language_tip"></label>
      <select id="lang" onchange="setLang(this.value)">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select></div>
  </div>

  <main>

  <div class="card">
    <section aria-labelledby="setup-title">
    <div class="workflow-head">
      <span class="step-number" aria-hidden="true">1</span>
      <div>
        <h2 class="panel-title" id="setup-title" data-i18n="setup_title"></h2>
        <p class="panel-desc" data-i18n="setup_desc"></p>
      </div>
    </div>
    <label for="dir" data-i18n="folder_label"></label>
    <div class="folder-row">
      <input type="text" id="dir" data-i18n-placeholder="folder_ph" oninput="handleDirInput()">
      <button class="ghost" onclick="pickDir()" data-i18n="pick_dir"></button>
      <button class="ghost" id="loadDocsBtn" onclick="loadDocs()" data-i18n="load_docs"></button>
    </div>
    <div id="docs" class="docs"></div>
    <div id="docsToolbar" class="docs-toolbar" hidden>
      <span id="docsStatus" role="status" aria-live="polite"></span>
      <button type="button" class="ghost" id="toggleDocs" onclick="toggleAllDocs()"></button>
    </div>
    </section>
    <div class="workflow-divider"></div>
    <section aria-labelledby="experiment-title">
    <div class="workflow-head">
      <span class="step-number" aria-hidden="true">2</span>
      <div>
        <h2 class="panel-title" id="experiment-title" data-i18n="experiment_title"></h2>
        <p class="panel-desc" data-i18n="experiment_desc"></p>
      </div>
    </div>
    <div class="parameter-grid">
      <div><label for="mode" data-i18n="mode"></label>
        <select id="mode">
          <option value="summary" data-i18n="mode_a"></option>
          <option value="structure" data-i18n="mode_b"></option>
        </select></div>
      <div><label for="gens" data-i18n="gens"></label>
        <input type="number" id="gens" value="3" min="1" max="10" aria-describedby="gensHelp">
        <span class="field-help" id="gensHelp" data-i18n="gens_help"></span></div>
      <div><label for="nqa" data-i18n="nqa"></label>
        <input type="number" id="nqa" value="6" min="2" max="12" aria-describedby="nqaHelp">
        <span class="field-help" id="nqaHelp" data-i18n="nqa_help"></span></div>
      <div><label for="backend" data-i18n="backend"></label>
        <select id="backend">
          <option value="claude" data-i18n="backend_claude"></option>
          <option value="codex" data-i18n="backend_codex"></option>
        </select></div>
      <button id="go" onclick="startRun()" data-i18n="run_exp" disabled></button>
      <span id="msg" class="err msg" role="status" aria-live="polite"></span>
    </div>
    </section>
  </div>

  <section class="card" aria-labelledby="wiki-title">
    <div class="workflow-head">
      <span class="step-number" aria-hidden="true">3</span>
      <div>
        <h2 class="panel-title" id="wiki-title" data-i18n="wiki_title"></h2>
        <p class="panel-desc" data-i18n="wiki_desc"></p>
      </div>
    </div>
    <div class="action-row" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
      <button id="auditBtn" class="ghost" onclick="startAudit()" data-i18n="btn_audit" disabled></button>
      <button id="applyBtn" onclick="startApply()" data-i18n="btn_apply" disabled></button>
      <span id="msg2" class="err" role="status" aria-live="polite"></span>
    </div>
    <details><summary data-i18n="strategy_custom"></summary>
      <label class="sr-only" for="strategy" data-i18n="strategy_label"></label>
      <textarea id="strategy" rows="3" style="margin-top:8px"></textarea>
    </details>
  </section>

  <div class="section-head">
    <h2 data-i18n="runs_title"></h2>
    <span class="count" id="runsCount"></span>
  </div>
  <div id="jobs"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const open_ = new Set();   // 펼쳐둔 job id
const LOCALES = { ko: "ko-KR", en: "en-US", zh: "zh-CN" };
let loadedDir = "";
let docsRequest = 0;
let docsController = null;
let requestPending = false;
let hasActiveJob = false;

// ---------- i18n ----------
const I18N = {
  ko: {
    subtitle: "wiki 폴더를 지정하고 요약(A) / 구조(B) 최적화를 돌려 결과 변화를 확인합니다",
    language: "언어", language_tip: "화면과 LLM 출력(요약·질문·답변) 언어를 함께 바꿉니다",
    setup_title: "위키 불러오기", setup_desc: "최적화할 원본 마크다운이 있는 폴더를 선택하세요.",
    experiment_title: "실험 설정", experiment_desc: "진화 방식과 반복 횟수를 정한 뒤 선택한 문서로 실험을 시작합니다.",
    folder_label: "wiki 폴더 경로 (.md 모음 — raw/ 하위 폴더가 있으면 그쪽을 읽음)",
    folder_ph: "~/dev/llm_wiki  또는  data/raw",
    pick_dir: "폴더 선택…", load_docs: "문서 불러오기",
    mode: "모드", mode_a: "A — 요약 전략 진화 (문서별)", mode_b: "B — 폴더 구조 진화 (선택 문서 전체)",
    gens: "세대 수", gens_help: "세대당 문서별 약 1–2분",
    nqa: "질문 수", nqa_help: "정답률 평가 문항 (2–12)",
    backend: "백엔드", backend_claude: "claude (Claude Code 구독)", backend_codex: "codex (ChatGPT 구독)",
    run_exp: "실험 실행",
    wiki_title: "내 위키 진단 · 최적화",
    wiki_desc: "위 폴더(raw/ + wiki/)를 기준으로 현재 요약을 채점(Before)하고, best 전략으로 다시 요약해(After) 무엇이 바뀌는지 비교합니다. 원본과 기존 wiki는 수정하지 않습니다.",
    btn_audit: "현재 위키 진단 (Before)", btn_apply: "최적화 생성 (After)",
    strategy_custom: "전략 직접 지정 (비우면 실험 결과의 best 전략 사용)",
    strategy_label: "직접 지정할 최적화 전략",
    docs_selected: (n,t) => `${t}개 문서 중 ${n}개 선택`, select_all: "모두 선택", clear_all: "선택 해제",
    runs_title: "실험 기록", runs_count: n => `${n}건`,
    need_dir: "폴더 경로를 입력하세요", need_dir_first: "위에서 폴더를 먼저 지정하세요",

let LANG = "ko";
try { LANG = localStorage.getItem("wikiopt_lang") || "ko"; } catch (e) {}
if (!I18N[LANG]) LANG = "ko";

function t(key, ...args) {
  const v = (I18N[LANG] || I18N.ko)[key] ?? I18N.ko[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
}

function applyLang() {
  document.documentElement.lang = LANG;
  $("lang").value = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  syncDocSelection();
}

function setLang(lang) {
  LANG = I18N[lang] ? lang : "ko";
  try { localStorage.setItem("wikiopt_lang", LANG); } catch (e) {}
  applyLang();
  lastHtml = "";   // job 카드도 새 언어로 다시 그린다
  poll();
}

// ---------- 데이터 로드/실행 ----------
function syncActionStates() {
  const ready = Boolean(loadedDir) && $("dir").value.trim() === loadedDir;
  const selected = document.querySelectorAll("#docs input[type=checkbox]:checked").length;
  const busy = requestPending || hasActiveJob;
  $("auditBtn").disabled = !ready || busy;
  $("applyBtn").disabled = !ready || busy;
  $("go").disabled = selected === 0 || busy;
}

function syncDirActions() {
  syncActionStates();
}

function clearDocs() {
  loadedDir = "";
  $("docs").innerHTML = "";
  syncDocSelection();
  syncDirActions();
}

function handleDirInput() {
  docsController?.abort();
  if ($("dir").value.trim() !== loadedDir) clearDocs();
  else syncDirActions();
}

function syncDocSelection() {
  const boxes = [...document.querySelectorAll("#docs input[type=checkbox]")];
  const selected = boxes.filter(x => x.checked).length;
  $("docsToolbar").hidden = boxes.length === 0;
  $("docsStatus").textContent = boxes.length ? t("docs_selected", selected, boxes.length) : "";
  $("toggleDocs").textContent = selected === boxes.length ? t("clear_all") : t("select_all");
  syncActionStates();
}

function toggleAllDocs() {
  const boxes = [...document.querySelectorAll("#docs input[type=checkbox]")];
  const shouldSelect = boxes.some(x => !x.checked);
  boxes.forEach(x => { x.checked = shouldSelect; });
  syncDocSelection();
}

function renderDocs(docs) {
  const fragment = document.createDocumentFragment();
  docs.forEach(d => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    const size = document.createElement("span");
    input.type = "checkbox";
    input.value = d.path;
    input.addEventListener("change", syncDocSelection);
    size.className = "sz";
    size.textContent = `${(d.size/1000).toFixed(1)}k`;
    label.append(input, document.createTextNode(d.name), size);
    fragment.append(label);
  });
  $("docs").replaceChildren(fragment);
}

async function loadDocs() {
  $("msg").textContent = "";
  const dir = $("dir").value.trim();
  if (!dir) { $("msg").textContent = t("need_dir"); return; }
  const requestId = ++docsRequest;
  docsController?.abort();
  docsController = new AbortController();
  clearDocs();
  $("loadDocsBtn").disabled = true;
  $("loadDocsBtn").setAttribute("aria-busy", "true");
  try {
    const r = await fetch(`/api/docs?dir=${encodeURIComponent(dir)}`, {signal: docsController.signal});
    const j = await r.json();
    if (requestId !== docsRequest || $("dir").value.trim() !== dir) return;
    if (!r.ok || j.error) { $("msg").textContent = j.error || t("load_failed"); return; }
    if (!j.docs.length) { $("msg").textContent = t("no_md"); return; }
    renderDocs(j.docs);
    loadedDir = dir;
    syncDocSelection();
    syncDirActions();
  } catch (e) {
    if (requestId === docsRequest && e.name !== "AbortError") $("msg").textContent = t("load_failed");
  } finally {
    if (requestId === docsRequest) {
      $("loadDocsBtn").disabled = false;
      $("loadDocsBtn").removeAttribute("aria-busy");
    }
  }
}

async function pickDir() {
  $("msg").textContent = "";
  const r = await fetch("/api/pick-dir");
  const j = await r.json();
  if (j.error) { $("msg").textContent = j.error; return; }
  if (j.cancelled) return;
  $("dir").value = j.dir;
  syncDirActions();
  loadDocs();
}

async function startJobRequest(body, msgEl) {
  if (requestPending || hasActiveJob) return;
  $(msgEl).textContent = "";
  requestPending = true;
  syncActionStates();
  try {
    const r = await fetch("/api/runs", { method:"POST",
      headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok || j.error) { $(msgEl).textContent = j.error || t("request_failed"); return; }
    open_.add(j.id);
    hasActiveJob = true;
  } catch (e) {
    $(msgEl).textContent = t("request_failed");
  } finally {
    requestPending = false;
    syncActionStates();
    poll();
  }
}

function startAudit() {
  const dir = $("dir").value.trim();
  if (!dir) { $("msg2").textContent = t("need_dir_first"); return; }
  startJobRequest({ mode:"audit", dir, n_qa:6, backend:$("backend").value,
    language:LANG }, "msg2");
}

function startApply() {
  const dir = $("dir").value.trim();
  if (!dir) { $("msg2").textContent = t("need_dir_first"); return; }
  startJobRequest({ mode:"apply", dir, n_qa:6, backend:$("backend").value,
    language:LANG, strategy: $("strategy").value.trim() }, "msg2");
}

async function startRun() {
  if (requestPending || hasActiveJob) return;
  $("msg").textContent = "";
  const files = [...document.querySelectorAll("#docs input:checked")].map(x => x.value);
  if (!files.length) { $("msg").textContent = t("need_docs"); return; }
  requestPending = true;
  syncActionStates();
  try {
    const r = await fetch("/api/runs", { method:"POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ files, mode: $("mode").value,
        generations: +$("gens").value, n_qa: +$("nqa").value,
        backend: $("backend").value, language: LANG }) });
    const j = await r.json();
    if (!r.ok || j.error) { $("msg").textContent = j.error || t("request_failed"); return; }
    open_.add(j.id);
    hasActiveJob = true;
  } catch (e) {
    $("msg").textContent = t("request_failed");
  } finally {
    requestPending = false;
    syncActionStates();
    poll();
  }
}

// ---------- 뷰 ----------
function wrapTable(inner) { return `<div class="table-wrap"><table>${inner}</table></div>`; }

// 단어 단위 unified diff (LCS). 너무 길면 하이라이트 생략.
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  if (A.length * B.length > 500000)
    return `<div class="diff">${esc(b)}</div>`;
  const n = A.length, m = B.length;
  const dp = Array.from({length: n+1}, () => new Uint16Array(m+1));
  for (let i = n-1; i >= 0; i--)
    for (let j = m-1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { if (A[i].trim()) out += `<del>${esc(A[i])}</del>`; i++; }
    else { if (B[j].trim()) out += `<ins>${esc(B[j])}</ins>`; else out += esc(B[j]); j++; }
  }
  while (i < n) { if (A[i].trim()) out += `<del>${esc(A[i])}</del>`; i++; }
  while (j < m) { out += B[j].trim() ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
  return `<div class="diff">${out}</div>`;
}

function fmtScore(s) {
  return s ? `${s.total} <span style="color:var(--dim)">(acc ${s.accuracy} · eff ${s.efficiency})</span>` : "-";
}

function auditView(res, status) {
  const prog = res.done < res.total ? `<span class="muted">${t("scoring_docs", res.done, res.total)}</span>` : "";
  let html = `<div class="runbox"><h3>${t("audit_title")}${prog}</h3>`;
  if (res.avg_total != null)
    html += `<div class="kpis"><div class="kpi"><b>${res.avg_total}</b><span>${t("avg_score", res.n_scored)}</span></div></div>`;
  html += wrapTable(`<tr><th>${t("th_doc")}</th><th>${t("th_raw")}</th><th>${t("th_summary")}</th><th>${t("th_score")}</th></tr>` +
    (res.docs||[]).map(d => `<tr><td>${esc(d.name)}</td>
      <td>${(d.raw_chars/1000).toFixed(1)}k</td>
      <td>${d.has_summary ? `${((d.wiki_chars||0)/1000).toFixed(1)}k` : `<span class="err">${t("none")}</span>`}</td>
      <td>${fmtScore(d.score)}</td></tr>`).join(""));
  return html + "</div>";
}

function applyView(res, status) {
  const prog = res.done < res.total || status === "running" ? `<span class="muted">${t("generating", res.done||0, res.total||"?")}</span>` : "";
  let html = `<div class="runbox"><h3>${t("apply_title")}${prog}</h3>`;
  if (res.avg_after != null) {
    const b = res.avg_before, a = res.avg_after;
    const dir_ = b == null ? "" : a > b ? "up" : a < b ? "down" : "";
    html += `<div class="kpis">
      <div class="kpi"><b>${b ?? "-"}</b><span>${t("before_avg")}</span></div>
      <div class="kpi"><b class="${dir_}">${a}</b><span>${t("after_avg")}</span></div></div>`;
  }
  if (res.strategy)
    html += `<details><summary>${t("used_strategy", esc(res.strategy_source||""))}</summary>
      <pre>${esc(res.strategy)}</pre></details>`;
  if (res.out_dir)
    html += `<div class="note">${t("after_files", esc(res.out_dir))}</div>`;
  html += (res.docs||[]).map(d => {
    const bs = d.before?.score, as_ = d.after?.score;
    const head = `${esc(d.name)} &nbsp; ${fmtScore(bs)}<span class="arrow">→</span>${fmtScore(as_)}`;
    let body = "";
    if (d.before?.content && d.after?.content)
      body = `<div class="note">${t("diff_legend", d.before.content.length, d.after.content.length)}</div>` +
        wordDiff(d.before.content, d.after.content);
    else if (d.after?.content)
      body = `<div class="note">${t("new_summary")}</div>
        <pre>${esc(d.after.content)}</pre>`;
    return `<details><summary>${head}</summary>${body}</details>`;
  }).join("");
  return html + "</div>";
}

function chart(hist, key, bestGen) {
  const W = 640, H = 180, P = 32;
  const xs = hist.map(h => h.generation);
  const X = i => P + (W - 2*P) * (xs.length === 1 ? 0.5 : i / (xs.length - 1));
  const Y = v => H - P - (H - 2*P) * Math.max(0, Math.min(1, v));
  const line = (get, stroke, extra="") => {
    const pts = hist.map((h, i) => `${X(i)},${Y(get(h))}`);
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${stroke}" ${extra}/>` +
      hist.map((h, i) => `<circle cx="${X(i)}" cy="${Y(get(h))}" r="3" fill="${stroke}"/>`).join("");
  };
  const chartLabel = t("chart_label", bestGen);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(chartLabel)}"><title>${esc(chartLabel)}</title>`;
  for (const v of [0, .5, 1]) {
    svg += `<line x1="${P}" y1="${Y(v)}" x2="${W-P}" y2="${Y(v)}" stroke="var(--line-subtle)" stroke-dasharray="3 5"/>
            <text x="4" y="${Y(v)+4}">${v}</text>`;
  }
  if (hist[0][key])
    svg += line(h => (h[key]||{}).total ?? 0, "var(--line-strong)", 'stroke-width="1.5" stroke-dasharray="4 5"');
  svg += line(h => h.score.total, "var(--acc)", 'stroke-width="2.5"');
  if (bestGen != null) {
    const bi = xs.indexOf(bestGen);
    if (bi >= 0) {
      svg += `<circle cx="${X(bi)}" cy="${Y(hist[bi].score.total)}" r="6" fill="none" stroke="var(--acc)" stroke-width="1.5"/>`;
    }
  }
  xs.forEach((g, i) => { svg += `<text x="${X(i)-12}" y="${H-8}">${t("gen_short", g)}</text>`; });
  svg += `</svg>`;
  const legend = `<div class="chart-head"><span><i></i>${t("held_out")}</span>` +
    (hist[0][key] ? `<span><i class="train"></i>${t("train")}</span>` : "") + `</div>`;
  return `<div class="chart">${legend}${svg}</div>`;
}

function summaryRun(run) {
  const p = run.progress, rep = run.report;
  if (!p) return "";
  const best = p.history[p.best_gen >= 0 ? p.best_gen : 0] || {};
  let html = `<div class="runbox"><h3>${esc(p.doc)}
      <span class="muted">${t("gen_progress", p.done_generations, p.generations)}</span></h3>
    <div class="kpis">
      <div class="kpi"><b>${p.best_total}</b><span>${t("best_gen", p.best_gen)}</span></div>
      <div class="kpi"><b>${(best.score||{}).accuracy ?? "-"}</b><span>${t("accuracy")}</span></div>
      <div class="kpi"><b>${(best.score||{}).efficiency ?? "-"}</b><span>${t("efficiency")}</span></div>
    </div>
    ${chart(p.history, "train_score", p.best_gen)}
    <details><summary>${t("strategy_per_gen")}</summary>${wrapTable(
      `<tr><th>${t("generation_label")}</th><th>${t("held_out")}</th><th>${t("ratio")}</th><th>${t("th_strategy")}</th></tr>` +
      p.history.map(h => `<tr${h.generation===p.best_gen?' class="is-best"':''}>
        <td>${h.generation}${h.generation===p.best_gen?" ★":""}</td>
        <td>${h.score.total}</td><td>${h.score.length_ratio}</td>
        <td>${esc(h.strategy)}</td></tr>`).join(""))}
    </details>`;
  if (rep && rep.best && rep.best.summary) {
    const ratio = (rep.history[rep.best.generation]||{}).score?.length_ratio;
    html += `<details><summary>${t("best_summary")}</summary>
      <div class="note">${t("len_vs_raw")}
        <span class="lenbar"><i style="width:${Math.min(100,(ratio||0)*100)}%"></i></span>
        ${ratio!=null ? (ratio*100).toFixed(0)+"%" : ""}</div>
      <pre>${esc(rep.best.summary)}</pre></details>`;
  }
  return html + "</div>";
}

function structureRun(run) {
  const p = run.progress, rep = run.report;
  if (!p) return "";
  let html = `<div class="runbox"><h3>${t("structure_title", p.docs.map(esc).join(", "))}
      <span class="muted">${t("gen_progress", p.done_generations, p.generations)}</span></h3>
    <div class="kpis"><div class="kpi"><b>${p.best_total}</b><span>${t("best_gen", p.best_gen)}</span></div></div>
    ${chart(p.history, "", p.best_gen)}
    <details><summary>${t("files_per_gen")}</summary>${wrapTable(
      `<tr><th>${t("generation_label")}</th><th>${t("total")}</th><th>${t("acc_short")}</th><th>${t("eff_short")}</th><th>${t("th_files")}</th></tr>` +
      p.history.map(h => `<tr${h.generation===p.best_gen?' class="is-best"':''}>
        <td>${h.generation}${h.generation===p.best_gen?" ★":""}</td>
        <td>${h.score.total}</td><td>${h.score.accuracy}</td><td>${h.score.efficiency}</td>
        <td>${(h.file_titles||[]).map(esc).join("<br>")}</td></tr>`).join(""))}
    </details>`;
  const det = rep?.best?.result?.details;
  if (det) {
    html += `<details><summary>${t("routing")}</summary>${wrapTable(
      `<tr><th>${t("th_q")}</th><th>${t("th_picked")}</th><th>${t("th_chars")}</th><th>${t("th_correct")}</th></tr>` +
      det.map(d => `<tr><td>${esc(d.q)}</td><td>${(d.picked||[]).map(esc).join(", ")}</td>
        <td>${d.read_chars}</td><td>${d.score ? "⭕" : "❌"}</td></tr>`).join(""))}
    </details>`;
  }
  return html + "</div>";
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function renderJob(j) {
  const isOpen = open_.has(j.id);
  const badge = `<span class="badge b-${j.status}">${t("status_" + j.status)}</span>`;
  const when = new Date(j.created_at*1000).toLocaleTimeString(LOCALES[LANG]);
  let inner = `<div class="job-body" id="job-${j.id}-body" hidden></div>`;
  if (isOpen) {
    const r = await fetch(`/api/runs/${j.id}`);
    const d = await r.json();
    let body = "";
    if (d.error && !d.result && !d.runs?.length) body = `<div class="err">${esc(d.error)}</div>`;
    else {
      if (d.status === "error") body += `<div class="err runbox">${t("failed")}: ${esc(d.error)}</div>`;
      if (j.mode === "audit" || j.mode === "apply") {
        body += d.result
          ? (j.mode === "audit" ? auditView(d.result, d.status) : applyView(d.result, d.status))
          : `<div class="runbox" style="color:var(--dim)">${t("preparing_q")}</div>`;
      } else {
        body += d.runs.map(run =>
          (run.progress?.mode === "structure" ? structureRun(run) : summaryRun(run))).join("")
          || `<div class="runbox" style="color:var(--dim)">${t("waiting_gen")}</div>`;
      }
    }
    inner = `<div class="job-body" id="job-${j.id}-body">${body}</div>`;
  }
  return `<div class="card">
    <button type="button" class="job-head" data-job-id="${j.id}" onclick="toggle('${j.id}')"
      aria-expanded="${isOpen}" aria-controls="job-${j.id}-body">
      ${badge} <span class="mode">${t("mode_" + j.mode)}</span>
      <span class="docs-list">${j.doc_names.map(esc).join(", ")}</span>
      <span class="meta">${t("run_meta", j.mode, j.backend, j.generations, when)}</span>
      <span class="chev${isOpen ? " open" : ""}" aria-hidden="true">▾</span>
    </button>${inner}</div>`;
}

function toggle(id) { open_.has(id) ? open_.delete(id) : open_.add(id); poll(); }

let timer = null, lastHtml = "";
async function poll() {
  clearTimeout(timer);
  const focusedJobId = document.activeElement?.dataset?.jobId;
  const expandedDetails = [...document.querySelectorAll("#jobs details")]
    .flatMap((el, index) => el.open ? [index] : []);
  let delay = 10000;
  try {
    const r = await fetch("/api/runs");
    if (!r.ok) throw new Error(`poll failed: ${r.status}`);
    const { jobs } = await r.json();
    const parts = await Promise.all(jobs.map(renderJob));
    const html = parts.join("") ||
      `<div class="card empty-state"><strong>${t("no_jobs")}</strong>${t("no_jobs_hint")}</div>`;
    $("runsCount").textContent = jobs.length ? t("runs_count", jobs.length) : "";
    hasActiveJob = jobs.some(j => j.status === "running" || j.status === "queued");
    delay = hasActiveJob ? 2000 : 10000;
    if (html !== lastHtml) {
      $("jobs").innerHTML = html;
      lastHtml = html;
      const details = document.querySelectorAll("#jobs details");
      expandedDetails.forEach(index => { if (details[index]) details[index].open = true; });
      if (focusedJobId)
        document.querySelector(`[data-job-id="${focusedJobId}"]`)?.focus();
    }
  } catch (e) {
    delay = 3000;
  } finally {
    syncActionStates();
    timer = setTimeout(poll, delay);
  }
}

applyLang();
syncDirActions();
poll();
</script>
