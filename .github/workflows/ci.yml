name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Lint (errors only)
        run: ruff check --select E9,F src tests
      - name: Compile
        run: python -m py_compile src/*.py
      - name: Unit tests
        run: pytest tests -q
      - name: Harness shell tests
        run: bash tests/test_harness.sh
